name: Daily Content Pipeline

on:
  schedule:
    - cron: '0 21 * * *'  # 毎日 JST 06:00 (UTC 21:00)
  workflow_dispatch:        # 手動実行も可能

jobs:
  generate-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Python 依存関係のインストール
        run: pip install -r scripts/requirements.txt

      - name: パイプラインの実行（収集 + 記事生成）
        run: python scripts/pipeline.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}

      - name: 生成コンテンツをコミット & プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts/ raw_data/
          git diff --staged --quiet || git commit -m "chore: auto-generate articles $(date +%Y-%m-%d)"
          git push
